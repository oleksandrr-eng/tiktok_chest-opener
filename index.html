<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Treasure Chest</title>
    <link rel="icon" id="favicon">
    <link rel="apple-touch-icon" id="touch-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ================= Base ================= */
        :root {
            --bg: #ffffff;
            --text: #161823;
            --muted: #80838c;
            --line: #ececf0;
            --surface: #f4f4f6;
            --accent: #fe2c55;
            --accent-press: #e3214a;
            --gold: #ffd36b;
            --ok: #1fbf6c;
            --ease: cubic-bezier(.3, .7, .2, 1);
            --spring: cubic-bezier(.3, 1.6, .5, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
        img { display: block; -webkit-user-drag: none; user-select: none; }
        svg { display: block; }

        .app {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100vh;      /* old browsers */
            height: 100dvh;     /* modern phones: excludes the address bar */
            margin: 0 auto;
            overflow: hidden;
            background: var(--bg);
        }
        @media (min-width: 600px) {
            body { background: #f2f2f4; }
            .app { box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, 0.06); }
        }

        /* ================= Screens ================= */
        .screen {
            position: absolute; top: 0; right: 0; bottom: 0; left: 0;
            display: flex; flex-direction: column;
            padding: 16px 20px 20px;
            padding: max(16px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            overflow-y: auto;
            transition: transform 0.38s var(--ease), opacity 0.38s, visibility 0s;
        }
        .screen.is-left, .screen.is-right {
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: transform 0.38s var(--ease), opacity 0.38s, visibility 0s 0.38s;
        }
        .screen.is-left  { transform: translateX(-25%); }
        .screen.is-right { transform: translateX(25%); }

        /* ================= Buttons ================= */
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            flex-shrink: 0;
            width: 100%; height: 54px; border-radius: 14px;
            background: var(--accent); color: #fff;
            font-size: 16px; font-weight: 700;
            transition: transform 0.12s, background 0.15s;
        }
        .btn:active { transform: scale(0.98); background: var(--accent-press); }
        .btn svg { width: 20px; height: 20px; }
        .btn--light { background: var(--surface); color: var(--text); }
        .btn--light:active { background: var(--line); }

        .icon-btn {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--surface);
        }
        .icon-btn svg { width: 22px; height: 22px; }
        .icon-btn--empty { background: none; }

        /* ================= Chest ================= */
        .chest {
            position: relative;
            width: 300px; max-width: 78vw;
            transform-origin: 50% 90%;
        }
        .chest::before { content: ''; display: block; padding-top: 66%; }   /* keeps the 394:260 shape in every browser */
        .chest--small  { width: 230px; max-width: 62vw; }

        .chest img { position: absolute; left: 0; width: 100%; height: auto; }
        .chest .chest__base { bottom: 0; z-index: 1; transition: opacity 0.12s; }
        .chest .chest__lid  { top: 0; z-index: 2; transform-origin: 50% 100%; transition: transform 0.3s var(--spring), opacity 0.12s; }
        .chest .chest__open {           /* lid thrown back, treasure inside — lined up with the closed chest */
            left: 3.63%; top: 3.65%; width: 94.9%; z-index: 3;
            opacity: 0; transform: scale(0.96); transform-origin: 50% 90%;
            transition: opacity 0.12s, transform 0.35s var(--spring);
            pointer-events: none;
        }
        .chest__glow {
            position: absolute; left: 18%; right: 18%; top: 22%; height: 46%; z-index: 0;
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(255, 214, 90, 0.95), rgba(255, 214, 90, 0));
            opacity: 0; transform: scale(0.4);
            transition: opacity 0.3s, transform 0.4s;
        }
        .chest__shadow {
            position: absolute; left: 3%; right: 2%; bottom: 8%; height: 9%; z-index: 0;
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(0, 0, 0, 0.16), rgba(0, 0, 0, 0));
            opacity: 0; transition: opacity 0.12s;
        }
        .spark {
            position: absolute; z-index: 4;
            left: var(--x); top: var(--y);
            width: 16px; height: 16px; margin: -8px 0 0 -8px;
            background: #fff;
            clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
            opacity: 0; pointer-events: none;
        }

        .chest.is-open .chest__base,
        .chest.is-open .chest__lid    { opacity: 0; }
        .chest.is-open .chest__lid    { transform: translateY(-40%) rotate(-6deg); }
        .chest.is-open .chest__open   { opacity: 1; transform: scale(1); }
        .chest.is-open .chest__glow   { opacity: 1; transform: scale(1.7); }
        .chest.is-open .chest__shadow { opacity: 1; }
        .chest.is-open .spark         { animation: twinkle 0.7s ease-in-out var(--d) infinite; }

        .chest.bounce { animation: bounce 0.5s ease-out; }
        .chest.wiggle { animation: wiggle 0.45s ease-in-out; }
        .chest--small .chest__lid { animation: peek-loop 3.2s ease-in-out 1s infinite; }
        .chest.peek .chest__lid   { animation: peek 0.8s ease-in-out; }

        @keyframes bounce  { 0% { transform: scale(1); } 25% { transform: scale(1.06, 0.92); } 55% { transform: scale(0.97, 1.05); } 100% { transform: scale(1); } }
        @keyframes wiggle  { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-4deg); } 40% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); } }
        @keyframes peek      { 0%, 100% { transform: none; } 30% { transform: translateY(-7%) rotate(-2deg); } 50% { transform: none; } 70% { transform: translateY(-3%); } }
        @keyframes peek-loop { 0%, 70%, 100% { transform: none; } 78% { transform: translateY(-7%) rotate(-2deg); } 85% { transform: none; } 92% { transform: translateY(-3%); } }
        @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }

        /* ================= Intro screen ================= */
        .intro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px 0 20px; }
        .badge {
            margin-top: 22px; padding: 6px 12px; border-radius: 999px;
            background: #fff0f3; color: var(--accent);
            font-size: 13px; font-weight: 700;
        }
        .intro h1 { margin-top: 12px; font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
        .lead { margin-top: 10px; max-width: 330px; color: var(--muted); font-size: 15.5px; line-height: 1.5; }
        .steps { list-style: none; width: 100%; max-width: 340px; margin-top: 24px; text-align: left; }
        .steps li {
            display: flex; align-items: center; gap: 12px;
            margin-top: 10px; padding: 12px 14px; border-radius: 14px;
            background: var(--surface);
            font-size: 15px; font-weight: 600;
        }
        .steps li:first-child { margin-top: 0; }
        .steps b {
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            width: 28px; height: 28px; border-radius: 50%;
            background: #fff; color: var(--accent); font-size: 14px; font-weight: 800;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        .fine { margin-top: 16px; max-width: 330px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }

        /* ================= Game screen ================= */
        .topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; flex-shrink: 0; }
        .topbar h2 { font-size: 17px; font-weight: 700; }

        /* Balance card */
        .card {
            position: relative; flex-shrink: 0;
            height: 44vw; max-height: 170px;
            margin-top: 12px; border-radius: 18px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: #0b0b0b center / cover no-repeat;
            color: #fff;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
            transition: box-shadow 0.3s;
        }
        .card__label {
            position: absolute; top: 16px; left: 0; right: 0; z-index: 1;
            text-align: center; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
        }
        .card__row  { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; }
        .card__coin { width: 42px; height: 42px; flex-shrink: 0; }
        .card__gain {
            position: absolute; bottom: 14px; left: 50%; z-index: 1;
            padding: 3px 10px; border-radius: 999px;
            background: rgba(255, 211, 107, 0.16); color: var(--gold);
            font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
            opacity: 0; transform: translate(-50%, 4px) scale(0.9);
            transition: opacity 0.25s, transform 0.25s;
        }
        .card__shine {
            position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none;
            background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.22) 50%, transparent 65%);
            transform: translateX(-120%);
        }

        .card.is-charging { box-shadow: 0 0 0 2px rgba(255, 205, 90, 0.55), 0 14px 40px rgba(255, 170, 40, 0.35); }
        .card.is-charging .odo { color: var(--gold); filter: drop-shadow(0 0 10px rgba(255, 190, 60, 0.6)); }
        .card.is-charging .card__gain { opacity: 1; transform: translate(-50%, 0); }
        .card.hit   { animation: card-hit 0.16s ease-out; }
        .card.shine .card__shine { animation: shine 0.9s ease-out; }
        .card__coin.hit { animation: coin-hit 0.22s ease-out; }

        @keyframes card-hit { 0% { transform: translateY(2px) scale(0.995); } 100% { transform: none; } }
        @keyframes shine    { to { transform: translateX(120%); } }
        @keyframes coin-hit {
            0%   { transform: scale(1.28); filter: drop-shadow(0 0 10px rgba(255, 205, 90, 0.95)); }
            100% { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(255, 205, 90, 0)); }
        }

        /* Rolling digits */
        .odo {
            display: flex; height: 1.1em; overflow: hidden;
            font-size: 40px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s, filter 0.3s;
        }
        .odo__digit { height: 1.1em; overflow: hidden; }
        .odo__strip { display: block; transition: transform 0.5s cubic-bezier(.2, .9, .25, 1); }
        .odo__strip span { display: block; height: 1.1em; text-align: center; }
        .odo.pop { animation: pop 0.45s var(--spring); }
        @keyframes pop { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }

        /* Coin landing effects */
        .ring {
            position: absolute; z-index: 2; width: 46px; height: 46px; margin: -23px 0 0 -23px;
            border: 2px solid rgba(255, 211, 107, 0.9); border-radius: 50%;
            pointer-events: none;
            animation: ring 0.5s ease-out forwards;
        }
        @keyframes ring { from { transform: scale(0.5); opacity: 1; } to { transform: scale(1.9); opacity: 0; } }
        .dot {
            position: absolute; z-index: 2; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
            border-radius: 50%; background: var(--gold); pointer-events: none;
        }
        .fly { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; will-change: transform; }

        /* Chest area */
        .stage {
            position: relative; flex: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            touch-action: none; user-select: none; -webkit-user-select: none;
            cursor: grab; outline: none;
        }
        .chest-wrap { transition: transform 0.35s var(--spring); }
        .hint {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            margin-top: 26px;
            color: var(--muted); font-size: 14px; font-weight: 600;
            transition: opacity 0.25s, color 0.2s;
        }
        .hint svg { width: 26px; height: 26px; color: var(--accent); animation: bob 1.2s ease-in-out infinite; }
        .stage.is-busy .hint { opacity: 0; }
        .hint.flash { color: var(--accent); }
        @keyframes bob { 0%, 100% { transform: translateY(4px); } 50% { transform: translateY(-4px); } }

        .game-footer { padding-top: 12px; }

        /* ================= Toast ================= */
        .toast {
            position: absolute; left: 50%; top: 74px; z-index: 70;
            padding: 10px 16px; border-radius: 12px;
            background: var(--text); color: #fff; font-size: 14px; font-weight: 600; white-space: nowrap;
            opacity: 0; pointer-events: none;
            transform: translate(-50%, -10px);
            transition: opacity 0.2s, transform 0.2s;
        }
        .toast.is-shown { opacity: 1; transform: translate(-50%, 0); }

        /* ================= Send sheet ================= */
        .backdrop {
            position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 40;
            background: rgba(22, 24, 35, 0.4);
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }
        .sheet {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
            padding: 8px 20px 20px;
            padding: 8px 20px max(20px, env(safe-area-inset-bottom));
            border-radius: 22px 22px 0 0;
            background: #fff;
            box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.12);
            transform: translateY(105%);
            transition: transform 0.35s cubic-bezier(.3, .8, .2, 1);
        }
        .app.sheet-open .backdrop { opacity: 1; pointer-events: auto; }
        .app.sheet-open .sheet    { transform: translateY(0); }

        .sheet__grabber { width: 40px; height: 5px; border-radius: 3px; background: #dcdce2; margin: 0 auto 14px; }
        .sheet__head { display: flex; align-items: center; justify-content: space-between; }
        .sheet h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
        .sheet [hidden] { display: none; }
        .close-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); }
        .close-btn svg { width: 18px; height: 18px; }

        .amount {
            display: flex; align-items: center; gap: 8px;
            margin-top: 14px; padding: 12px 14px; border-radius: 14px;
            background: var(--surface);
            color: var(--muted); font-size: 15px; font-weight: 500;
        }
        .amount img { width: 26px; height: 26px; }
        .amount b { color: var(--text); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }

        .field {
            display: flex; align-items: center;
            margin-top: 12px; height: 54px; padding: 0 14px; border-radius: 14px;
            border: 1.5px solid var(--line);
            transition: border-color 0.15s;
        }
        .field:focus-within { border-color: var(--text); }
        .field.is-invalid { border-color: var(--accent); animation: wiggle 0.3s; }
        .field span { color: var(--muted); font-size: 17px; font-weight: 700; margin-right: 2px; }
        .field input {
            flex: 1; min-width: 0; height: 100%;
            border: 0; outline: none; background: transparent;
            font: inherit; font-size: 17px; font-weight: 600; color: var(--text);   /* 16px+ stops iOS zooming in */
        }
        .field input::placeholder { color: #b5b7bd; font-weight: 500; }
        .error { min-height: 20px; margin: 6px 2px 8px; color: var(--accent); font-size: 13px; font-weight: 600; }

        .center { text-align: center; padding: 8px 0 4px; }
        .spinner {
            width: 56px; height: 56px; margin: 6px auto 16px;
            border-radius: 50%;
            border: 5px solid var(--surface); border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .muted { margin-top: 6px; color: var(--muted); font-size: 15px; line-height: 1.45; }
        .progress { height: 8px; margin-top: 18px; border-radius: 99px; background: var(--surface); overflow: hidden; }
        .progress div { width: 0; height: 100%; border-radius: 99px; background: var(--accent); }
        .percent { margin-top: 8px; color: var(--muted); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

        .check {
            display: flex; align-items: center; justify-content: center;
            width: 64px; height: 64px; margin: 4px auto 14px;
            border-radius: 50%; background: var(--ok);
            animation: check-pop 0.45s var(--spring);
        }
        .check svg { width: 32px; height: 32px; }
        @keyframes check-pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .done-text { margin-top: 6px; font-size: 16px; line-height: 1.45; }
        .inline-coin { display: inline-block; width: 1.3em; height: 1.3em; margin-right: 4px; vertical-align: -0.3em; }
        .buttons { margin-top: 18px; }
        .buttons .btn + .btn { margin-top: 10px; }

        /* ================= Smaller screens ================= */
        @media (max-height: 760px) {
            .intro { padding: 0 0 14px; }
            .chest--small { width: 180px; max-width: 50vw; }
            .badge { margin-top: 12px; }
            .intro h1 { margin-top: 8px; font-size: 28px; }
            .lead { margin-top: 8px; font-size: 14.5px; }
            .steps { margin-top: 16px; }
            .steps li { margin-top: 8px; padding: 9px 12px; font-size: 14px; }
            .steps b { width: 26px; height: 26px; font-size: 13px; }
            .fine { margin-top: 10px; font-size: 12px; }
            .card { height: 116px; }
            .card__label { top: 11px; }
            .card__gain { bottom: 9px; }
            .card__coin { width: 34px; height: 34px; }
            .odo { font-size: 32px; }
        }
        @media (max-height: 600px) {
            .chest--small { width: 130px; max-width: 40vw; }
            .badge { display: none; }
            .intro h1 { font-size: 24px; }
            .lead { font-size: 13.5px; }
            .steps li { padding: 7px 10px; font-size: 13px; }
            .btn { height: 48px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .chest--small .chest__lid, .hint svg { animation: none; }
        }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- ================= Screen 1: it's a prank ================= -->
    <section class="screen" id="intro">
        <div class="intro">
            <div class="chest chest--small">
                <img class="chest__base" data-img="base" alt="">
                <img class="chest__lid" data-img="lid" alt="">
            </div>
            <span class="badge" data-t="badge"></span>
            <h1 data-t="introTitle"></h1>
            <p class="lead" data-t="introText"></p>
            <ol class="steps">
                <li><b>1</b><span data-t="step1"></span></li>
                <li><b>2</b><span data-t="step2"></span></li>
                <li><b>3</b><span data-t="step3"></span></li>
            </ol>
            <p class="fine" data-t="introNote"></p>
        </div>
        <button class="btn" data-action="play" data-t="play"></button>
    </section>

    <!-- ================= Screen 2: the game ================= -->
    <section class="screen is-right" id="game">
        <header class="topbar">
            <button class="icon-btn" data-action="back" data-t-label="back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h2 data-t="title"></h2>
            <span class="icon-btn icon-btn--empty"></span>
        </header>

        <div class="card" id="card">
            <span class="card__shine"></span>
            <span class="card__label" data-t="balance"></span>
            <div class="card__row">
                <img class="card__coin" id="card-coin" data-img="coin" alt="">
                <span class="odo" id="odo" role="status"></span>
            </div>
            <span class="card__gain" id="card-gain"></span>
        </div>

        <div class="stage" id="stage" tabindex="0" data-t-label="hint">
            <div class="chest-wrap" id="chest-wrap">
                <div class="chest" id="chest">
                    <span class="chest__glow"></span>
                    <span class="chest__shadow"></span>
                    <img class="chest__base" data-img="base" alt="">
                    <img class="chest__lid" data-img="lid" alt="">
                    <img class="chest__open" data-img="open" alt="">
                    <i class="spark" style="--x:35%; --y:37%; --d:0s"></i>
                    <i class="spark" style="--x:64%; --y:35%; --d:.25s"></i>
                    <i class="spark" style="--x:52%; --y:44%; --d:.45s"></i>
                    <i class="spark" style="--x:41%; --y:33%; --d:.6s"></i>
                </div>
            </div>
            <p class="hint" id="hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                <span data-t="hint"></span>
            </p>
        </div>

        <div class="game-footer">
            <button class="btn" data-action="send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                <span data-t="send"></span>
            </button>
        </div>
    </section>

    <div class="toast" id="toast"></div>

    <!-- ================= Send sheet ================= -->
    <div class="backdrop" data-action="close"></div>

        <div class="sheet__grabber"></div>

        <div data-step="form">
            <div class="sheet__head">
                <h2 data-t="sheetTitle"></h2>
                <button class="close-btn" data-action="close" data-t-label="close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>

                <b id="sheet-amount">0</b> <span data-t="coins"></span>

        </div>

            <div class="check">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
            </div>

            <p class="done-text" id="done-text"></p>
            <div class="buttons">
                <button class="btn" data-action="again" data-t="tryAgain"></button>
                <button class="btn btn--light" data-action="learn" data-t="learnMore"></button>
            </div>
        </div>
    </div>
</div>

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const wait = (ms) => new Promise((done) => setTimeout(done, ms));
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const fmt = (n) => n.toLocaleString(CONFIG.locale);
const fill = (str, vars) => str.replace(/\{(\w+)\}/g, (_, key) => (key in vars ? vars[key] : ''));
const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const canAnimate = 'animate' in Element.prototype;
const reducedMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* Sound (tiny synth, no files) and vibration */
let audio = null;
function unlockAudio() {
    if (!CONFIG.sound) return;
    try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
}
function beep(freq, duration = 0.1, volume = 0.07, delay = 0, type = 'sine') {
    if (!audio) return;
    const t = audio.currentTime + delay;
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start(t);
    osc.stop(t + duration);
}
const vibrate = (pattern) => { if (CONFIG.vibration && navigator.vibrate) navigator.vibrate(pattern); };

const app = $('#app');
const screens = { intro: $('#intro'), game: $('#game') };
const stage = $('#stage'), chestWrap = $('#chest-wrap'), chest = $('#chest'), hint = $('#hint');
const card = $('#card'), cardCoin = $('#card-coin'), cardGain = $('#card-gain'), odo = $('#odo');
const sheet = $('#sheet'), field = $('#field'), username = $('#username'), errorEl = $('#error');
const toastEl = $('#toast');

const state = { screen: 'intro', balance: 0, busy: false, step: 'form', landing: null };

/* Fill in texts and images */
$$('[data-t]').forEach((el) => { el.textContent = TEXT[el.dataset.t]; });
$$('[data-t-label]').forEach((el) => el.setAttribute('aria-label', TEXT[el.dataset.tLabel]));
$$('[data-t-placeholder]').forEach((el) => el.setAttribute('placeholder', TEXT[el.dataset.tPlaceholder]));
$$('[data-img]').forEach((el) => { el.src = IMAGES[el.dataset.img]; });
card.style.backgroundImage = `url("${IMAGES.card}")`;
$('#favicon').href = $('#touch-icon').href = IMAGES.coin;
document.title = TEXT.title;

/* =====================================================================
   Screens & toast
   ===================================================================== */
function showScreen(name) {
    state.screen = name;
    screens.intro.classList.toggle('is-left', name !== 'intro');
    screens.game.classList.toggle('is-right', name !== 'game');
}

let toastTimer;
function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('is-shown');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('is-shown'), 1800);
}

/* =====================================================================
   Balance — rolling digits
   ===================================================================== */
function makeDigit() {
    const digit = document.createElement('span');
    digit.className = 'odo__digit';
    digit.innerHTML = '<span class="odo__strip">' + '0123456789'.split('').map((n) => `<span>${n}</span>`).join('') + '</span>';
    return digit;
}

function setBalance(value) {
    state.balance = value;
    const chars = fmt(value).split('');

    while (odo.children.length < chars.length) odo.insertBefore(document.createElement('span'), odo.firstChild);
    while (odo.children.length > chars.length) odo.removeChild(odo.firstElementChild);

    chars.forEach((ch, i) => {
        let slot = odo.children[i];
        const isDigit = /\d/.test(ch);
        if (isDigit && !slot.classList.contains('odo__digit')) {
            const digit = makeDigit();
            odo.replaceChild(digit, slot);
            slot = digit;
        } else if (!isDigit && (slot.classList.contains('odo__digit') || slot.textContent !== ch)) {
            const sep = document.createElement('span');
            sep.textContent = ch;
            odo.replaceChild(sep, slot);
            slot = sep;
        }
        if (isDigit) {
            const strip = slot.firstElementChild;
            void strip.offsetHeight;                          // new digits roll in from 0
            strip.style.transform = `translateY(${-ch * 10}%)`;
        }
    });
    odo.setAttribute('aria-label', `${fmt(value)} ${TEXT.coins}`);
}

/* =====================================================================
   Chest: swipe up to open
   ===================================================================== */
let dragStart = null, dragY = 0;

stage.addEventListener('pointerdown', (e) => {
    if (state.busy) return;
    unlockAudio();
    dragStart = e.clientY;
    dragY = 0;
    if (stage.setPointerCapture) stage.setPointerCapture(e.pointerId);
    chestWrap.style.transition = 'none';
});
stage.addEventListener('pointermove', (e) => {
    if (dragStart === null) return;
    dragY = Math.min(0, e.clientY - dragStart);
    chestWrap.style.transform = `translateY(${Math.max(dragY * 0.45, -70)}px)`;
});
function endDrag() {
    if (dragStart === null) return;
    dragStart = null;
    chestWrap.style.transition = '';
    chestWrap.style.transform = '';
    if (dragY < -45) openChest();
    else if (dragY > -6) nudge();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); unlockAudio(); openChest(); }
});

function nudge() {
    restart(chest, 'wiggle');
    hint.classList.add('flash');
    setTimeout(() => hint.classList.remove('flash'), 600);
}

// the lid peeks now and then so the chest feels alive
setInterval(() => {
    if (state.screen === 'game' && !state.busy && dragStart === null && !app.classList.contains('sheet-open')) {
        restart(chest, 'peek');
    }
}, 3500);

async function openChest() {
    if (state.busy) return;
    state.busy = true;
    stage.classList.add('is-busy');
    chest.classList.remove('peek', 'wiggle');
    restart(chest, 'bounce');
    chest.classList.add('is-open');
    beep(520, 0.12, 0.08, 0, 'triangle');
    beep(780, 0.14, 0.08, 0.08, 'triangle');
    beep(1170, 0.25, 0.07, 0.16);
    vibrate(25);

    await wait(160);
    state.landing = flyCoins(pick(CONFIG.amounts)).then(() => { state.landing = null; });

    await wait(1400);
    chest.classList.remove('is-open');
    beep(220, 0.12, 0.06, 0, 'triangle');
    vibrate(15);

    await wait(400);
    state.busy = false;
    stage.classList.remove('is-busy');
}

/* =====================================================================
   Coins: burst out of the chest, then swoop into the balance card
   ===================================================================== */
function flyCoins(amount) {
    if (!canAnimate) {                       // very old browsers: just add the coins
        setBalance(state.balance + amount);
        return Promise.resolve();
    }
    let allLanded;
    const done = new Promise((resolve) => { allLanded = resolve; });

    const count = reducedMotion ? 15 : CONFIG.coinsPerOpen;
    const share = Math.floor(amount / count);
    const from = chest.getBoundingClientRect();
    const to = cardCoin.getBoundingClientRect();
    const ox = from.left + from.width / 2, oy = from.top + from.height * 0.42;
    const ex = to.left + to.width / 2 - ox, ey = to.top + to.height / 2 - oy;
    let landed = 0, collected = 0;

    for (let i = 0; i < count; i++) {
        const value = i === count - 1 ? amount - share * (count - 1) : share;
        const size = 24 + Math.random() * 20;
        const coin = document.createElement('img');
        coin.src = IMAGES.coin;
        coin.className = 'fly';
        coin.style.cssText = `width:${size}px;height:${size}px;left:${ox - size / 2}px;top:${oy - size / 2}px`;
        document.body.appendChild(coin);

        coin.animate(coinPath(ex, ey), {
            duration: 1150 + Math.random() * 450,
            delay: i * 14,
            fill: 'forwards',
        }).onfinish = () => {
            coin.remove();
            landed++;
            collected += value;
            setBalance(state.balance + value);
            coinLanded(landed, collected, landed === count);
            if (landed === count) allLanded();
        };
    }
    return done;
}

// keyframes: pop out of the chest, hang for a moment, then curve into the card while speeding up
function coinPath(ex, ey) {
    const side = () => (Math.random() < 0.5 ? -1 : 1);
    const ax = (Math.random() - 0.5) * 340, ay = -(70 + Math.random() * 200);   // top of the burst
    const hx = ax * 1.04, hy = ay - 10;                                          // short hang
    const spin = side() * (360 + Math.random() * 540);
    const len = Math.hypot(ex - hx, ey - hy) || 1;
    const bend = side() * (60 + Math.random() * 120);
    const cx = (hx + ex) / 2 - ((ey - hy) / len) * bend;                         // curve control point
    const cy = (hy + ey) / 2 + ((ex - hx) / len) * bend;
    const frame = (x, y, scale, angle, offset) =>
        ({ transform: `translate(${x}px,${y}px) scale(${scale}) rotate(${angle}deg)`, opacity: 1, offset });

    const frames = [
        Object.assign(frame(0, 0, 0.3, 0, 0), { opacity: 0, easing: 'cubic-bezier(.15,.85,.3,1)' }),
        Object.assign(frame(ax, ay, 1, spin * 0.35, 0.34), { easing: 'ease-in-out' }),
        frame(hx, hy, 1.05, spin * 0.45, 0.44),
    ];
    for (let k = 1; k <= 12; k++) {
        const u = k / 12, t = Math.pow(u, 1.9);
        const x = (1 - t) * (1 - t) * hx + 2 * (1 - t) * t * cx + t * t * ex;
        const y = (1 - t) * (1 - t) * hy + 2 * (1 - t) * t * cy + t * t * ey;
        frames.push(frame(x, y, 1.05 - 0.7 * t, spin * (0.45 + 0.55 * u), 0.44 + 0.56 * u));
    }
    return frames;
}

function coinLanded(n, collected, isLast) {
    card.classList.add('is-charging');
    cardGain.textContent = '+' + fmt(collected);
    restart(cardCoin, 'hit');
    if (n % 2 === 0) restart(card, 'hit');
    if (n % 3 === 0) { landingRing(); beep(1300 + Math.min(n, 70) * 12, 0.05, 0.03); }
    if (n % 4 === 0) landingSparks();

    if (isLast) {
        restart(odo, 'pop');
        restart(card, 'shine');
        beep(988, 0.12);
        beep(1319, 0.22, 0.07, 0.08);
        vibrate(20);
        setTimeout(() => card.classList.remove('is-charging'), 900);
    }
}

function coinCenterInCard() {
    const c = card.getBoundingClientRect(), p = cardCoin.getBoundingClientRect();
    return { x: p.left - c.left + p.width / 2, y: p.top - c.top + p.height / 2 };
}
function addToCard(className) {
    const { x, y } = coinCenterInCard();
    const el = document.createElement('span');
    el.className = className;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    card.appendChild(el);
    return el;
}
function landingRing() {
    const ring = addToCard('ring');
    setTimeout(() => ring.remove(), 520);
}
function landingSparks() {
    for (let k = 0; k < 3; k++) {
        const dot = addToCard('dot');
        const a = Math.random() * Math.PI * 2, r = 22 + Math.random() * 22;
        dot.animate([
            { transform: 'translate(0,0) scale(1)', opacity: 1 },
            { transform: `translate(${Math.cos(a) * r}px,${Math.sin(a) * r}px) scale(0.2)`, opacity: 0 },
        ], { duration: 450, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => dot.remove();
    }
}

/* =====================================================================
   Send sheet
   ===================================================================== */
function setStep(name) {
    state.step = name;
    sheet.querySelectorAll('[data-step]').forEach((el) => { el.hidden = el.dataset.step !== name; });
}

let sheetQueued = false;
async function openSheet() {
    if (app.classList.contains('sheet-open') || sheetQueued) return;
    if (state.landing) {                     // coins still flying: wait for them, then open
        sheetQueued = true;
        await state.landing;
        sheetQueued = false;
    }
    if (state.balance <= 0) { toast(TEXT.openFirst); nudge(); return; }
    setStep('form');
    $('#sheet-amount').textContent = fmt(state.balance);
    errorEl.textContent = '';
    field.classList.remove('is-invalid');
    app.classList.add('sheet-open');
    sheet.setAttribute('aria-hidden', 'false');
    setTimeout(() => username.focus(), 350);
}

function closeSheet() {
    username.blur();
    app.classList.remove('sheet-open');
    sheet.setAttribute('aria-hidden', 'true');
    sheet.style.bottom = '';
}

function submit() {
    if (state.step !== 'form') return;
    const name = username.value.trim().replace(/^@+/, '');
    const error = !name ? TEXT.errorEmpty : !CONFIG.username.test(name) ? TEXT.errorFormat : '';
    if (error) {
        errorEl.textContent = error;
        restart(field, 'is-invalid');
        vibrate([20, 40, 20]);
        return;
    }
    username.blur();
    sheet.style.bottom = '';
    runTransfer({ name, amount: fmt(state.balance) });
}

function runTransfer(vars) {
    setStep('loading');
    const bar = $('#load-bar'), pct = $('#load-pct'), label = $('#load-text');
    const steps = TEXT.loading;
    const start = Date.now();

    // a plain timer (not animation frames) so it always finishes, even in in-app browsers
    const update = () => {
        const raw = Math.min(1, Math.max(0, (Date.now() - start) / CONFIG.transferMs));
        const p = 1 - Math.pow(1 - raw, 1.6);
        bar.style.width = p * 100 + '%';
        pct.textContent = Math.round(p * 100) + '%';
        label.textContent = fill(steps[Math.min(steps.length - 1, Math.floor(p * steps.length))], vars);
        return raw;
    };
    update();
    const timer = setInterval(() => {
        if (update() < 1) return;
        clearInterval(timer);
        setTimeout(() => finishTransfer(vars), 150);
    }, 30);
}

function finishTransfer(vars) {
    // "{amount} coins “sent” to @{name}" with a coin picture in front of the amount
    const doneText = $('#done-text');
    doneText.textContent = '';
    fill(TEXT.doneText, { name: vars.name, amount: '\u0000' }).split('\u0000').forEach((part, i) => {
        if (i > 0) {
            const coin = document.createElement('img');
            coin.className = 'inline-coin';
            coin.src = IMAGES.coin;
            coin.alt = '';
            doneText.appendChild(coin);
            doneText.appendChild(document.createTextNode(vars.amount));
        }
        doneText.appendChild(document.createTextNode(part));
    });
    setStep('done');
    setBalance(0);
    vibrate([30, 40, 60]);
    [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.22, 0.07, i * 0.09));
}

username.addEventListener('input', () => {
    if (username.value.charAt(0) === '@') username.value = username.value.replace(/^@+/, '');
    errorEl.textContent = '';
    field.classList.remove('is-invalid');
});
username.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

// keep the sheet above the on-screen keyboard
if (window.visualViewport) {
    const vv = window.visualViewport;
    const lift = () => {
        if (!app.classList.contains('sheet-open') || state.step !== 'form') return;
        sheet.style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px';
    };
    vv.addEventListener('resize', lift);
    vv.addEventListener('scroll', lift);
}

/* =====================================================================
   Buttons — every clickable element has data-action="..."
   ===================================================================== */
const actions = {
    play:   () => { unlockAudio(); showScreen('game'); },
    back:   () => showScreen('intro'),
    send:   openSheet,
    submit: submit,
    close:  () => { if (state.step === 'form') closeSheet(); },
    again:  () => { closeSheet(); showScreen('game'); },
    learn:  () => { closeSheet(); showScreen('intro'); },
};
document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (el && actions[el.dataset.action]) actions[el.dataset.action]();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && app.classList.contains('sheet-open')) actions.close();
});

setBalance(0);
</script>
</body>
</html>
